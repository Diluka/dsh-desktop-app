name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: Test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-2022
          - name: macOS arm64
            os: macos-14
          - name: macOS x86_64
            os: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Show tool versions
        run: |
          deno --version
          ssh -V

      - name: Run source checks and unit tests
        run: deno task check

  package:
    name: Package / ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2022
            package_task: package:windows
            artifact_name: dsh-desktop-windows-x86_64
            artifact_path: dist/windows/DSH-Desktop.msi
          - name: macOS arm64
            os: macos-14
            package_task: package:macos:aarch64
            artifact_name: dsh-desktop-macos-arm64
            artifact_path: dist/macos/DSH-Desktop-aarch64.dmg
          - name: macOS x86_64
            os: macos-15-intel
            package_task: package:macos:x86_64
            artifact_name: dsh-desktop-macos-x86_64
            artifact_path: dist/macos/DSH-Desktop-x86_64.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Build native desktop installer
        run: deno task ${{ matrix.package_task }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Update latest release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/DSH-Desktop.msi
          test -s release-assets/DSH-Desktop-aarch64.dmg
          test -s release-assets/DSH-Desktop-x86_64.dmg
          ls -lh release-assets

      - name: Create or replace latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "::notice::Skipping stale release for ${GITHUB_SHA}; main is ${current_main}."
            exit 0
          fi

          assets=(
            release-assets/DSH-Desktop.msi
            release-assets/DSH-Desktop-aarch64.dmg
            release-assets/DSH-Desktop-x86_64.dmg
          )
          cat > release-notes.md <<EOF
          This rolling release was built from commit \`${GITHUB_SHA}\`.

          It is updated only after all Linux, Windows, and macOS test jobs plus all
          Windows and macOS installer builds complete successfully.

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          if gh release view latest >/dev/null 2>&1; then
            existing_assets=$(gh release view latest --json assets --jq '.assets[].name')
            if grep -Fxq "DSH-Desktop.AppImage" <<<"${existing_assets}"; then
              gh release delete-asset latest DSH-Desktop.AppImage --yes
            fi
            gh release upload latest "${assets[@]}" --clobber
            git tag --force latest "${GITHUB_SHA}"
            git push origin refs/tags/latest --force
            gh release edit latest \
              --title "DSH Desktop - Latest Successful Build" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create latest "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "DSH Desktop - Latest Successful Build" \
              --notes-file release-notes.md \
              --latest
          fi
