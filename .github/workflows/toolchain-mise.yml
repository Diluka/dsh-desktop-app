name: Toolchain compatibility - mise

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: mise / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            node = "24.15.0"
      - name: Configure bash login profile
        shell: bash
        run: bash scripts/configure_node_manager_profile.sh mise
      - name: Verify login-shell resolution
        shell: bash
        run: bash scripts/run_toolchain_environment_check.sh
